# Local production-like run of the ExamPhotoFixer image (P12.2). Not used in production: the
# VPS runs this same image directly under host Nginx (docs/DEPLOYMENT.md "Docker"), with no
# compose file and no extra services. This file exists only to build/run/verify the image
# locally the same way it will run on the VPS.
services:
  examphotofixer:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://examphotofixer.com}
        NEXT_PUBLIC_SITE_INDEXABLE: ${NEXT_PUBLIC_SITE_INDEXABLE:-}
        NEXT_PUBLIC_CONTACT_EMAIL: ${NEXT_PUBLIC_CONTACT_EMAIL:-}
        NEXT_PUBLIC_ANALYTICS_DISABLED: ${NEXT_PUBLIC_ANALYTICS_DISABLED:-}
        GOOGLE_SITE_VERIFICATION: ${GOOGLE_SITE_VERIFICATION:-}
    image: examphotofixer:local
    init: true # reap zombies / forward signals cleanly (no extra OS package needed)
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
    restart: unless-stopped
